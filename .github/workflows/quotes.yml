# ============================================================================
#  MacroIntel · LIVE QUOTES — THE FEED (v145.1)
# ============================================================================
#  Real time without a server. Every five minutes of the session this job
#  starts and loops for nine and a half minutes: each minute one batched Yahoo
#  download for every name the page moves (quotes.json) and the session's
#  five-minute bars for the index and the most traded (intraday_live.json),
#  force-pushed to the orphan `live` branch — one commit, no history, nothing
#  on main, no Pages build. The next firing cancels the previous one, so the
#  loops overlap into continuous minute-by-minute coverage. The page reads the
#  files over CORS from raw.githubusercontent.com and labels them "feed".
#  GitHub's cron is best effort (it queues under load and sometimes skips),
#  which is why the page's own doors sit above the feed, not below it.
#  Public repo → Actions minutes are free. No secret, no key: GITHUB_TOKEN only.
#  Run it by hand once after uploading so the schedule registers.
# ============================================================================
name: Live quotes
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'How long to loop (minutes, max 330)'
        default: '10'
  schedule:
    - cron: '*/5 3-10 * * 1-5'    # every 5 min, 08:30 → 16:25 IST (UTC = IST − 5:30)

concurrency:
  group: macrointel-live-quotes
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # v145.1 · no pip-cache option here — with no requirements.txt in the repo, setup-python FAILS on
          # that option, which is why every five-minute run failed (and mailed) and the live branch never appeared

      - name: Install
        run: pip install yfinance pandas numpy

      - name: Feed the page, a pass every minute
        run: |
          M="${{ github.event.inputs.minutes }}"
          if [ -z "$M" ]; then M=9.5; fi
          S=$(python -c "print(int(float('$M')*60))")
          if [ "$S" -gt 19800 ]; then S=19800; fi
          echo "looping for $S seconds, a pass every 60 s"
          python quotes.py --loop "$S" --push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          echo "published → https://raw.githubusercontent.com/${{ github.repository }}/live/quotes.json"
