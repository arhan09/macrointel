# ============================================================================
#  MacroIntel · THE WATCHDOG (v145.1 · v148.1: no clock window, queued runs ignored)
# ============================================================================
#  GitHub's cron is best effort: scheduled runs queue under load, arrive hours
#  late, or never. The daily pipeline is meant to pass every hour 08:07 → 20:07
#  IST; when a pass is late the page goes stale and nobody is told.
#
#  This job is tiny (no Python, ~20 s) and fires every ten minutes through the
#  day. It looks at the last commit the pipeline made and at the daily workflow's
#  queue; if the last pass finished more than 75 minutes ago (a day on a weekend)
#  and nothing is actually running, it dispatches the daily workflow itself
#  (workflow_dispatch, GITHUB_TOKEN — allowed), at any hour. A run it
#  dispatches is logged on the page as "watchdog" in history/passes.json.
#  Ten-minute crons are themselves best effort — but one of six an hour lands.
# ============================================================================
name: Watchdog
on:
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * 1-6'   # every 10 min, around the clock Mon–Sat (GitHub delivers these late and in bunches — the more, the better)

concurrency:
  group: macrointel-watchdog
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (the tip of main only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Is the hourly pass late? Then dispatch it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          NOW=$(date -u +%s)
          # v148.1 · no clock window any more: a late pass beats no pass. Only the IST weekday matters for the
          # staleness bar — on a weekend nothing new prints, so the bar is a day, not 75 minutes.
          IST_D=$(TZ=Asia/Kolkata date +%u)
          BAR=75; if [ "$IST_D" -gt 5 ]; then BAR=1440; fi
          # the last pass = the last commit that touched the page (the pipeline commits at the end of every pass)
          LAST=$(git log -1 --format=%ct -- macro_intelligence_terminal.html || echo 0)
          AGE=$(( (NOW - LAST) / 60 ))
          echo "last pass finished $AGE min ago ($(date -u -d @$LAST +%H:%M) UTC) · bar $BAR min"
          if [ "$AGE" -lt "$BAR" ]; then echo "on time — nothing to do"; exit 0; fi
          # v148.1 · only a pass that is actually RUNNING holds the watchdog back — and only for an hour (the daily job times
          # out at 55). Queued/waiting runs do not count: GitHub's backlog keeps scheduled runs "queued" for hours, and
          # the v145.1 watchdog stood aside for them until they ran at night and were thrown away.
          RUNNING=$(gh run list --workflow daily-update.yml --status in_progress --json databaseId,startedAt --jq '[.[] | select((now - (.startedAt | fromdateiso8601)) < 3600)] | length' 2>/dev/null || echo 0)
          echo "daily workflow: $RUNNING in progress (started within the hour)"
          if [ "$RUNNING" != "0" ]; then echo "a pass is running — nothing to do"; exit 0; fi
          echo "::warning::the hourly pass is $AGE min late — dispatching the daily workflow"
          gh workflow run daily-update.yml -f reason=watchdog
          echo "dispatched"
