# ============================================================================
#  Macro Intelligence Terminal — auto-update + deploy to GitHub Pages
# ============================================================================
#  WHERE THIS GOES:  .github/workflows/daily-update.yml
#
#  v127 · adds: t127_env.py in the regression step, options_chain.json to the
#  site, and a step that FAILS the run when a published ledger row has no
#  payload on the site (the seeded 2026-09-02 row is marked and excluded).
#  v132 · adds: push_call.py — THE CALL to Telegram on the post-close pass
#  (two repo secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID; silent without).
#  v136 · off-peak cron minutes, five post-close attempts, steps decided by the
#  cron that fired (not the delayed start hour); the push sends once a day.
#
#  WHAT IT DOES:
#    1. Every 2 hours during India market hours (Mon–Fri) + a post-close pull
#    2. Installs Python + yfinance + ML deps
#    3. Runs update_terminal.py to refresh prices inside the HTML
#    4. Runs ml_models.py (HMM + predictors + movers)
#    5. Publishes to GitHub Pages
#
#  YOU CAN ALSO run it manually from the "Actions" tab (workflow_dispatch).
#
#  REQUIRED REPO FILES:
#    macro_intelligence_terminal.html   (the terminal)
#    update_terminal.py                 (the updater)
#    ml_models.py                       (the ML suite)
#    CNAME                              (one line: macrointel.in)
#    .github/workflows/daily-update.yml (this file)
# ============================================================================
name: Daily Terminal Update
on:
  workflow_dispatch:          # ← the manual "Run workflow" button
    inputs:
      push:
        description: 'Also push THE CALL to Telegram (needs the two secrets)'
        type: boolean
        default: false
  schedule:
    # Every 2 hours during India market hours (NSE 09:15–15:30 IST) + a post-close pull.
    # Times in UTC (IST = UTC+5:30). Mon–Fri only.
    # v136 · GitHub queues cron runs that start on popular minutes (:00/:30/:45) for
    # hours under load — the 12:30 pass was landing at 22:48 IST. Odd minutes, and
    # several post-close attempts so the first one after 15:30 IST does the close.
    - cron: '53 3 * * 1-5'    # 09:23 IST  — market open (prices only)
    - cron: '23 5 * * 1-5'    # 10:53 IST  — models
    - cron: '23 7 * * 1-5'    # 12:53 IST  — prices only
    - cron: '7 10 * * 1-5'    # 15:37 IST  — post-close: models, the call, the push
    - cron: '41 10 * * 1-5'   # 16:11 IST  — post-close attempt 2 (idempotent)
    - cron: '19 11 * * 1-5'   # 16:49 IST  — post-close attempt 3
    - cron: '3 12 * * 1-5'    # 17:33 IST  — post-close attempt 4 + tear sheet
    - cron: '29 13 * * 1-5'   # 18:59 IST  — post-close attempt 5 (bhavcopy usually up by now)

# v125 · one run at a time. Five overlapping 20-minute runs a day were racing
# each other on `git push`; the loser printed "nothing to push" and the
# frozen-ledger payloads it had written were discarded with the runner.
concurrency:
  group: macrointel-daily-update
  cancel-in-progress: false

# Pages deploy needs these permissions
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install yfinance scikit-learn pandas numpy scipy matplotlib playwright
          python -m playwright install --with-deps chromium

      - name: Refresh prices in the terminal
        run: |
          python update_terminal.py macro_intelligence_terminal.html
        continue-on-error: true   # if Yahoo hiccups, still deploy the last good file

      - name: Regression tests (fast suites; a red run is a real regression)
        run: |
          python t121_safety.py
          python t125_desk.py
          python t126_desk.py
          # v127 · the arena, the option chain, the risk forecast, the record's state source
          python t127_env.py

      - name: ML run (2x during market hours + post-close + manual)
        run: |
          # models refresh on the 11:15 IST and 15:15 IST passes, the 18:00 IST
          # post-close pass, and any manual trigger. The 09:15/13:15 passes are
          # prices-only — the page itself also live-streams quotes client-side.
          # v136 · decide by the cron that fired, not the hour it finally ran at
          # (a queued 05:23 cron can start at 08:xx); models on the 10:53 pass,
          # every post-close attempt, and any manual trigger.
          S="${{ github.event.schedule }}"
          if [ "$S" = "23 5 * * 1-5" ] || [ "$S" = "7 10 * * 1-5" ] || [ "$S" = "41 10 * * 1-5" ] || [ "$S" = "19 11 * * 1-5" ] || [ "$S" = "3 12 * * 1-5" ] || [ "$S" = "29 13 * * 1-5" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # v126 · the F&O desk's setups, evaluated by the page's own JS headless, feed the ledger
            python fno_setups.py || echo "fno_setups failed — ML pass continues without F&O calls"
            python ml_models.py || true
          else
            echo "prices-only pass — skipping models"
          fi

      - name: Push THE CALL (post-close pass, or a manual run with "push" ticked; silent without the secrets)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # v132 · the day's call — regime and state, the five names with stop and
          # target, the record — delivered to a Telegram channel. Reads only what
          # the pass wrote (fno_setups.json, ml_output.json); never touches the page.
          # every post-close attempt may push; push_call.py sends once per day (history/push_<date>.done)
          S="${{ github.event.schedule }}"
          case "$S" in
            "7 10 * * 1-5"|"41 10 * * 1-5"|"19 11 * * 1-5"|"3 12 * * 1-5"|"29 13 * * 1-5") python push_call.py || echo "push failed — the page is unaffected" ;;
            *) if [ "${{ github.event.inputs.push }}" = "true" ]; then python push_call.py || echo "push failed — the page is unaffected"; else echo "intraday pass — no push"; fi ;;
          esac

      - name: Build India daily tear sheet (post-close pass + manual only)
        run: |
          # regenerate the ~29-page tear sheet once a day (the 18:00 IST pass)
          # or on a manual trigger — not on every intraday pass, so the repo
          # doesn't grow by a PDF five times a day
          S="${{ github.event.schedule }}"
          if [ "$S" = "3 12 * * 1-5" ] || [ "$S" = "29 13 * * 1-5" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python tearsheet.py || echo "tear sheet failed — keeping last good copy"
          else
            echo "not the tear-sheet pass — skipping"
          fi

      - name: Build site folder
        run: |
          mkdir -p _site
          cp macro_intelligence_terminal.html _site/index.html
          if [ -f history.json ]; then cp history.json _site/history.json; fi
          if [ -f ml_output.json ]; then cp ml_output.json _site/ml_output.json; fi
          if [ -f tearsheet.html ]; then cp tearsheet.html _site/tearsheet.html; fi
          if [ -f tearsheet.pdf ]; then cp tearsheet.pdf _site/tearsheet.pdf; fi
          if [ -f history_1y.json ]; then cp history_1y.json _site/; fi
          # v127 · the full option chain rides to the site (loaded on demand by the
          # F&O desk); it is regenerated every pass and is NOT committed
          if [ -f options_chain.json ]; then cp options_chain.json _site/; fi
          # v133 · the session's 5-minute bars for the 1D chart (regenerated every pass, not committed)
          if [ -f intraday.json ]; then cp intraday.json _site/; fi
          if [ -f tearsheet_manifest.json ]; then cp tearsheet_manifest.json _site/; fi
          if [ -d tearsheet_pages ]; then cp -r tearsheet_pages _site/tearsheet_pages; fi
          if [ -d tearsheets ]; then cp -r tearsheets _site/tearsheets; fi
          # v125 · the frozen prediction payloads ride to the site: a hash on the
          # page that nobody can recompute is not evidence
          mkdir -p _site/history
          cp history/pred_*.json _site/history/ 2>/dev/null || echo "no frozen payloads yet"
          # v127 · the paper book's daily snapshots ride too (history/ is already committed)
          cp history/book_*.json _site/history/ 2>/dev/null || echo "no book snapshots yet"
          cp history/agents_*.json _site/history/ 2>/dev/null || echo "no agent snapshots yet"
          # keep the CNAME so the custom domain sticks
          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi

      - name: Verify the published ledger matches the published page
        run: |
          python - <<'PY'
          import json, os, re, sys
          html = open('_site/index.html', encoding='utf-8').read()
          m = re.search(r'window\.FROZEN_LEDGER\s*=\s*(\{.*?\});', html, re.S)
          if not m:
              print('::warning::no FROZEN_LEDGER block on the page'); sys.exit(0)
          blk = json.loads(m.group(1)); rows = blk.get('rows') or []
          seeded = set((blk.get('seeded') or {}).get('hashes') or [])
          have = set(os.listdir('_site/history')) if os.path.isdir('_site/history') else set()
          missing = [r['date'] for r in rows if r.get('hash') not in seeded
                     and not any(f.startswith('pred_%s' % r['date']) for f in have)]
          if missing:
              print('::error::%d of %d published ledger rows have no payload in _site/history: %s'
                    % (len(missing), len(rows), ', '.join(missing[:8]))); sys.exit(1)
          print('ledger: all %d published rows have a payload in _site/history (%d seeded row(s) excluded and marked)'
                % (len(rows) - len([r for r in rows if r.get('hash') in seeded]), len(seeded)))
          PY

      - name: Commit refreshed HTML back to the repo
        run: |
          git config user.name  "macrointel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add macro_intelligence_terminal.html ml_output.json history.json history/ history_1y.json fno_setups.json || true
          git add tearsheet.html tearsheet.pdf tearsheets/ tearsheet_manifest.json tearsheet_pages/ 2>/dev/null || true
          git commit -m "Auto-update prices $(date -u +%Y-%m-%d)" || echo "no changes"
          # v125 · rebase onto whatever landed meanwhile, retry, and FAIL loudly if
          # the push still does not land. `|| echo "nothing to push"` hid every
          # lost frozen-ledger payload since v122.
          ok=0
          for i in 1 2 3; do
            if git push; then ok=1; break; fi
            echo "push rejected (attempt $i) — rebasing"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
          done
          if [ "$ok" != "1" ]; then
            echo "::error::git push failed after 3 attempts — the frozen ledger payloads written this run are NOT in the repo"
            exit 1
          fi

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: always()
        uses: actions/deploy-pages@v4
